name: whisper

# hienanh/kellyfin-whisper = hienanh/whisper + narrator/whisper/server.py. Built when that folder changes (the base image is
# several GB, so not on every push), or by hand.
on:
  push:
    branches: [main]
    paths: ["narrator/whisper/**", ".github/workflows/whisper.yml"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tags
        run: |
          V=$(node -p "require('./package.json').version")
          I=hienanh/kellyfin-whisper
          echo "t=$I:latest,$I:$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: narrator/whisper
          push: true
          tags: ${{ steps.tags.outputs.t }}
