# film-sub on the CPU only: the same services and worker as docker-compose.yml, for a machine without an NVIDIA GPU
# (or with a broken one). Slower: see "CPU only" in README.md for what to expect and what to change.
#
#   cp .env.example .env      # set KELLYFIN_URL and KELLYFIN_NARRATOR_TOKEN (Kellyfin: Settings -> Narration)
#   docker compose -f docker-compose.cpu.yml up -d
#
# Use this file or docker-compose.yml, not both: they share container names and ports. No NVIDIA Container Toolkit
# needed; Whisper and EasyOCR models are inside the images. No VieNeu here: queue the "edge-tts only" pipelines
# (Vietnamese is read by edge-tts too). Needs about 6 GB of free memory, and every core you can give it.

name: film-sub

services:
  argos:
    image: hienanh/argos:latest
    container_name: fs-argos
    restart: unless-stopped
    environment:
      - LT_HOST=0.0.0.0
      - LT_PORT=5000
      - LT_LOAD_ONLY=en,vi,zh,ja,ko,ms,es
      - LT_THREADS=8

  # faster-whisper picks the CPU by itself when the container has no GPU (int8). Models in the image: tiny, small, medium;
  # the worker asks for WHISPER_MODEL (set in .env, read here and by the worker): medium, or small for ~2.5x the speed.
  whisper:
    image: hienanh/whisper:latest
    container_name: fs-whisper
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}

  easyocr:
    image: hienanh/easyocr:latest
    container_name: fs-easyocr
    restart: unless-stopped
    environment:
      - EASYOCR_LOAD_LANGS=vi
      - EASYOCR_USE_GPU=0

  nginx:
    image: nginx:1.27-alpine
    container_name: fs-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx:/etc/nginx-extra:ro
    entrypoint: ["/etc/nginx-extra/entrypoint.sh"]
    extra_hosts:
      - "host-gateway:host-gateway"
    depends_on: [argos, whisper, easyocr]

  kellyfin-narrator:
    image: hienanh/kellyfin-narrator:latest
    build: .
    container_name: kellyfin-narrator
    restart: unless-stopped
    environment:
      - "KELLYFIN_URL=${KELLYFIN_URL:?set it in .env, e.g. http://192.168.1.10:8024}"
      - "KELLYFIN_NARRATOR_TOKEN=${KELLYFIN_NARRATOR_TOKEN:?copy it from Kellyfin: Settings -> Narration}"
      - WORKER_NAME=${WORKER_NAME:-film-sub-cpu}
      - FILMSUB_URL=http://nginx
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WORKER_JOBS=${WORKER_JOBS:-3}
    depends_on: [nginx]
