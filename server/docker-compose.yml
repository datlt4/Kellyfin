# Runs next to Jellyfin; media is mounted read-only at the same paths Jellyfin uses.
services:
  kellyfin:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: ghcr.io/datlt4/kellyfin:latest
    container_name: kellyfin
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${KELLYFIN_PORT:-8024}:8080"
    environment:
      KELLYFIN_ADMIN_PASSWORD: ${KELLYFIN_ADMIN_PASSWORD:-}
    volumes:
      - /mnt/das_8tb/kellyfin_volume/data:/data
      - /mnt/das_8tb/jellyfin_volume/media:/media:ro
      - /mnt/das_8tb/jellyfin_volume/movies:/movies:ro
      - /mnt/das_8tb/jellyfin_volume/hanzii:/hanzii:ro
      - /mnt/das_8tb/metube_volume:/metube_volume:ro
