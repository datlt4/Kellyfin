# Media is mounted at the same paths Jellyfin used. Writable: narration (thuyết minh) adds audio tracks to the
# videos and subtitles next to them; nothing else writes there.
services:
  kellyfin:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: hienanh/kellyfin:${KELLYFIN_TAG:-latest}
    container_name: kellyfin
    restart: unless-stopped
    user: "1000:1000"
    # AMD/Intel GPU for VAAPI transcoding; 110 = host "render" group.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "110"
    # NVIDIA GPU for NVENC instead: install nvidia-container-toolkit on the host, then uncomment.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    ports:
      - "${KELLYFIN_PORT:-8024}:8080"
    environment:
      KELLYFIN_ADMIN_PASSWORD: ${KELLYFIN_ADMIN_PASSWORD:-}
    volumes:
      - /mnt/das_8tb/kellyfin_volume/data:/data
      - /mnt/das_8tb/jellyfin_volume/media:/media
      - /mnt/das_8tb/jellyfin_volume/movies:/movies
      - /mnt/das_8tb/jellyfin_volume/hanzii:/hanzii
      - /mnt/das_8tb/metube_volume:/metube_volume
