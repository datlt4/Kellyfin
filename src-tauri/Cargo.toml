[package]
name = "kellyfin"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "kellyfin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true
